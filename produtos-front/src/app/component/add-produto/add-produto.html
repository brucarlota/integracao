<div class="add-produto-container">
	<h2>Adicionar produto</h2>
	<form (ngSubmit)="criarProduto()">
		<label for="nome">Nome
			<input type="text" id="nome" placeholder="Ex.: bolsa térmica" autocomplete="off" [ngModel]="novoProduto().nome" (ngModelChange)="atualizarNome($event)" name="nome" required />
		</label>
		<label for="preco">Preço (R$)
			<input type="number" id="preco" min="0.01" step="0.01" placeholder="0,00" [ngModel]="novoProduto().preco" (ngModelChange)="atualizarPreco($event)" name="preco" required />
		</label>
		<div class="form-actions">
			<button type="submit">Adicionar</button>
		</div>
	</form>
</div>
