<section class="list-section">
	<header class="list-head">
		<h2>Lista de produtos</h2>
		<span class="count">{{ produtos().length }} {{ produtos().length === 1 ? 'item' : 'itens' }}</span>
	</header>

	<p class="load-error" *ngIf="erroCarregamento()">{{ erroCarregamento() }}</p>

	<ul *ngIf="produtos().length > 0 && !erroCarregamento()">
		<li *ngFor="let produto of produtos()">
			<div class="product-info">
				<span class="product-name">{{ produto.nome.charAt(0).toUpperCase() + produto.nome.slice(1) }}</span>
				<span class="product-price">{{ produto.preco | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</span>
			</div>
			<button class="details-button" type="button" (click)="detalharProduto(produto.id)">Detalhes</button>
		</li>
	</ul>

	<p class="empty-state" *ngIf="produtos().length === 0 && !erroCarregamento()">
		Nenhum produto encontrado.
	</p>
</section>

<app-modal
	*ngIf="produtoSelecionado() as produto"
	[produto]="produto"
	(fechado)="fecharModal()"
	(salvo)="produtoSalvo($event)"
	(removido)="removerProduto($event)"
></app-modal>
